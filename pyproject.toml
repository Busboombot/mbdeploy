[project]
name = "mbdeploy"
version = "0.20260827.5"
requires-python = ">=3.10"
dependencies = ["pyocd>=0.44.1", "pyserial>=3.5", "zeroconf>=0.150.0", "intelhex>=2.3.0"]

[project.scripts]
mbdeploy = "mbdeploy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package, including the bundled agent manual markdown and the
# systemd unit template `--print-service`/`--install-service` render.
packages = ["src/mbdeploy"]
artifacts = [
    "src/mbdeploy/agent_manual.md",
    "src/mbdeploy/service/mbdeploy.service.template",
]
